services:
  postgres:
    image: postgres:16
    container_name: userservice-postgres
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: userservice
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - userservice-pg-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: userservice-redis
    ports:
      - "6379:6379"

volumes:
  userservice-pg-data: